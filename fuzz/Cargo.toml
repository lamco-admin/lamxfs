[package]
name = "lamxfs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.lamxfs]
path = ".."

[[bin]]
name = "fuzz_open"
path = "fuzz_targets/fuzz_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_walk"
path = "fuzz_targets/fuzz_walk.rs"
test = false
doc = false
bench = false

# Keep the fuzz crate out of the parent (already standalone) workspace.
[workspace]
